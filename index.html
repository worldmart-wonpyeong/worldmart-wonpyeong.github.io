<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="월드마트 중국식품 원평동 - 중국·연변 식품, 냉동 만두, 훠궈 재료, 월병, 수입 쌀. 영업시간 평일 09:30-22:00, 주말 09:00-22:00. 위챗 worldmart_hwan">
<title>월드마트 중국식품</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap">
<style>
:root{
  --bg:#F5F6F3;
  --surface:#FFFFFF;
  --ink:#16201D;
  --muted:#5D6A65;
  --line:#DDE2DE;
  --jade:#0E5C4B;
  --jade-soft:#E3EFEA;
  --red:#C3321F;
  --gold:#B8862B;
  --ph:#EEF1EE;
  --ph-ink:#A9B4AF;
  --open:#1F7A4A;
  --closed:#9A3B2E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1513; --surface:#171F1C; --ink:#EDF1EE; --muted:#9AA8A2; --line:#26312D;
    --jade:#5FC2A5; --jade-soft:#1B2D27; --red:#F07A63; --gold:#E0B25A;
    --ph:#1D2723; --ph-ink:#4E5D57; --open:#6BD69A; --closed:#F08B78;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1513; --surface:#171F1C; --ink:#EDF1EE; --muted:#9AA8A2; --line:#26312D;
  --jade:#5FC2A5; --jade-soft:#1B2D27; --red:#F07A63; --gold:#E0B25A;
  --ph:#1D2723; --ph-ink:#4E5D57; --open:#6BD69A; --closed:#F08B78;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.55;
  padding-inline:16px; padding-block:0 48px;
}
.wrap{max-width:760px;margin:0 auto}

/* Header */
header.store{padding-block:28px 20px;display:grid;gap:14px}
.brand{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand h1{
  font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;
  font-size:clamp(34px,9vw,48px);line-height:1;margin:0;letter-spacing:-.01em;
  text-wrap:balance;
}
.brand h1 .w{color:var(--red)}
.brand .sub{font-size:15px;color:var(--muted);font-weight:500;padding-bottom:4px}
.seal{
  font-family:"Noto Serif SC",serif;font-size:13px;color:var(--red);
  border:1.5px solid var(--red);border-radius:4px;padding:2px 6px;letter-spacing:.1em;
  align-self:center;
}
.tagline{margin:0;color:var(--muted);max-width:52ch}

.info{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  display:grid;grid-template-columns:1fr 1fr;
}
.info > div{padding:14px 16px;display:grid;gap:4px;align-content:start}
.info > div + div{border-left:1px solid var(--line)}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.open{color:var(--open)} .status.closed{color:var(--closed)}
.hours{display:grid;grid-template-columns:auto 1fr;column-gap:10px;font-variant-numeric:tabular-nums;font-size:14px}
.hours dt{color:var(--muted)} .hours dd{margin:0}
.phone{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em;user-select:all}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.btn{
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);
  padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* Search + chips */
.tools{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5;
  background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;
  border-bottom:1px solid var(--line);
}
.search{position:relative}
.search input{
  width:100%;font:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px 11px 40px;
}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font:inherit;font-size:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 13px;border-radius:999px;white-space:nowrap;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.6;margin-left:3px;font-variant-numeric:tabular-nums}

/* Sections */
section.cat{padding-top:26px;display:grid;gap:12px;scroll-margin-top:120px}
.cat-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat-head h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:24px;margin:0}
.cat-head .zh{font-family:"Noto Serif SC",serif;color:var(--gold);font-size:15px}
.cat-head .note{font-size:13px;color:var(--muted);flex-basis:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px;align-items:center;
}
.ph{
  width:72px;height:72px;border-radius:8px;background:var(--ph);
  display:grid;place-items:center;overflow:hidden;
  font-family:"Noto Serif SC",serif;color:var(--ph-ink);font-size:17px;text-align:center;line-height:1.15;padding:4px;
}
.ph img{width:100%;height:100%;object-fit:cover}
.meta{display:grid;gap:2px;min-width:0}
.name{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.desc{font-size:12.5px;color:var(--muted);line-height:1.4}
.price{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums;font-size:16px;margin-top:2px}
.price small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.price .ask{font-size:13px;font-weight:500;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.opts span{font-size:11.5px;background:var(--jade-soft);color:var(--jade);padding:1px 7px;border-radius:5px}
.badge{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.04em}

[hidden]{display:none!important}
.item.has-g{cursor:pointer}
.item.has-g:hover{border-color:var(--jade)}
.more{font-size:12px;color:var(--jade);font-weight:700;margin-top:2px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,15,13,.6);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px;display:grid;gap:12px}
@media (min-width:700px){.modal{place-items:center}}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m-head h3{margin:0;font-size:17px}
.x{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;width:36px;height:36px;cursor:pointer;flex:none}
.m-main{width:100%;border-radius:10px;display:block}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.flav{display:grid;gap:3px}
.flav .crop{width:100%;border-radius:8px;background-repeat:no-repeat;background-color:var(--ph)}
.flav b{font-size:14px}
.flav span{font-size:12px;color:var(--muted);font-family:"Noto Serif SC",serif}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:4px}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;
}
@media (max-width:460px){
  .info{grid-template-columns:1fr}
  .info > div + div{border-left:0;border-top:1px solid var(--line)}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ html{scroll-behavior:smooth} }
</style>
</head>
<body>

<div class="wrap">
  <header class="store">
    <div class="brand">
      <h1><span class="w">월드</span>마트</h1>
      <span class="sub">중국식품 · 원평동</span>
      <span class="seal">世界超市</span>
    </div>
    <p class="tagline">중국·연변 식품, 냉동 만두와 훠궈 재료, 수입 쌀까지. 매장에 있는 상품을 미리 확인하세요.</p>

    <div class="info">
      <div>
        <span class="label">영업시간</span>
        <span id="status" class="status open">영업 중</span>
        <dl class="hours">
          <dt>평일</dt><dd>09:30 – 22:00</dd>
          <dt>주말</dt><dd>09:00 – 22:00</dd>
        </dl>
      </div>
      <div>
        <span class="label">위챗 문의 · 微信</span>
        <span class="phone" id="phone">worldmart_hwan</span>
        <div class="actions">
          <button class="btn primary" id="copyPhone" type="button">아이디 복사</button>
          <a class="btn" href="https://map.naver.com/p/search/%EC%9B%94%EB%93%9C%EB%A7%88%ED%8A%B8%20%EC%A4%91%EA%B5%AD%EC%8B%9D%ED%92%88%20%EC%9B%90%ED%8F%89%EB%8F%99" target="_blank" rel="noopener">네이버 지도</a>
        </div>
      </div>
    </div>
  </header>

  <div class="tools">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="상품 검색 (예: 만두, 월병, 쌀)" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="toolbar" aria-label="카테고리"></div>
  </div>

  <main id="list"></main>

  <footer>
    <span>가격은 환율과 매장 사정에 따라 바뀔 수 있습니다. 재고는 위챗으로 문의해 주세요.</span>
    <span>월드마트 중국식품 · 원평동 · 위챗 worldmart_hwan</span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="m-head"><h3 id="mTitle"></h3><button class="x" id="mClose" type="button" aria-label="닫기">✕</button></div>
    <img class="m-main" id="mMain" alt="">
    <div class="m-grid" id="mGrid"></div>
  </div>
</div>

<script>
/* ───────── 상품 목록: 여기만 고치면 됩니다 ─────────
   img: 나중에 사진 주소를 넣으면 자리표시 대신 사진이 나옵니다 */
const CATEGORIES = [
  { id:"dumpling", name:"만두·셴빙", zh:"饺子·馅饼", items:[
    { name:"희가득 물만두 600g", zh:"禧家德", price:4700, img:"img/heegadeuk-6.webp", gallery:[{k:"표고버섯",zh:"猪肉香菇",r:[325,235,325,235]},{k:"셀러리",zh:"猪肉芹菜",r:[0,0,305,240]},{k:"삼선",zh:"猪肉三鲜",r:[305,0,320,240]},{k:"배추",zh:"猪肉白菜",r:[610,0,290,215]},{k:"부추",zh:"猪肉韭菜",r:[0,245,330,250]},{k:"산차이",zh:"猪肉酸菜",r:[650,190,250,250]}], opts:["표고버섯","셀러리","삼선","배추","부추","산차이"], desc:"6종 전 품목 균일가" },
    { name:"희가득 부추계란만두", zh:"韭菜鸡蛋", price:6300 },
    { name:"희가득 입쌀만두", zh:"大米饺", price:9000 },
    { name:"미선 부추계란 새우만두", zh:"虾仁饺", price:6500 },
    { name:"미선 샤오롱바오", zh:"小笼包", price:7000 },
    { name:"정의 손 훈둔", zh:"馄饨", price:5900 },
    { name:"정의 손만두 셀러리", zh:"芹菜饺", price:5900 },
    { name:"정의 손만두 계란부추", zh:"韭菜鸡蛋", price:5900 },
    { name:"부추계란 셴빙", zh:"馅饼", price:6500 },
    { name:"배추 셴빙", zh:"小白菜馅饼", price:6500 },
  ]},
  { id:"hotpot", name:"훠궈·어묵", zh:"火锅丸子", items:[
    { name:"모듬완자", zh:"八珍玉食", price:null },
    { name:"위왈", zh:"鱼丸", price:null, desc:"생선 완자" },
    { name:"머위왈", zh:"墨鱼丸", price:null, desc:"오징어 완자" },
    { name:"룽샤츄", zh:"龙虾球", price:null },
    { name:"위즈볼", zh:"鱼籽宝", price:null },
    { name:"냉동 위두부", zh:"鱼豆腐", price:null },
    { name:"뚱두부", zh:"冻豆腐", price:null, desc:"언두부" },
    { name:"삥샤", zh:"冰虾", price:null, desc:"냉동 새우" },
  ]},
  { id:"meat", name:"훠궈 고기", zh:"肉片", items:[
    { name:"소고기 슬라이스", zh:"肥牛肉片", price:null },
    { name:"양고기 롤", zh:"羔羊肉卷", price:null },
  ]},
  { id:"yanbian", name:"냉면·연변 간식", zh:"延边特产", items:[
    { name:"연길냉면 10인분", zh:"延吉冷面", price:null, opts:["옥수수","메밀"] },
    { name:"연길냉면 5인분", zh:"延吉冷面", price:null },
    { name:"연변특색 냉면", zh:"延边特色", price:null },
    { name:"연변찹쌀 순대", zh:"糯米肠", price:null },
    { name:"옥수수 5개", zh:"玉米", price:null },
    { name:"낸뚜보", zh:"粘豆包", price:null },
    { name:"탕웬", zh:"汤圆", price:null, opts:["오인","흑깨"] },
  ]},
  { id:"mooncake", name:"월병", zh:"月饼", note:"추석 시즌 상품", items:[
    { name:"또샹춘 북경식 월병", zh:"稻香村", price:null, badge:"추석" },
    { name:"오인·헤이즐넛 월병", zh:"五仁榛子", price:null, badge:"추석" },
    { name:"오인·흑깨 월병", zh:"五仁黑芝麻", price:null, badge:"추석" },
    { name:"대단원 월병 (오인)", zh:"大团圆", price:null, badge:"추석" },
    { name:"수빙", zh:"酥饼", price:null },
  ]},
  { id:"rice", name:"쌀", zh:"大米", items:[
    { name:"신동진쌀 2kg", zh:"新东进", price:null },
    { name:"신동진쌀 4kg", zh:"新东进", price:null },
    { name:"신동진쌀 10kg", zh:"新东进", price:null },
    { name:"베트남쌀 10kg", zh:"越南米", price:null },
    { name:"칼로스 미국쌀", zh:"加州米", price:null },
    { name:"바스마티쌀", zh:"印度香米", price:null },
  ]},
];
/* ─────────────────────────────────────────── */

const won = n => n.toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let active = "all";
let G = [];
const GW = 900, GH = 507;

function renderChips(){
  const total = CATEGORIES.reduce((a,c)=>a+c.items.length,0);
  const all = [{id:"all",name:"전체",n:total}, ...CATEGORIES.map(c=>({id:c.id,name:c.name,n:c.items.length}))];
  document.getElementById("chips").innerHTML = all.map(c =>
    `<button class="chip" type="button" data-id="${c.id}" aria-pressed="${c.id===active}">${esc(c.name)}<span class="n">${c.n}</span></button>`
  ).join("");
}

function card(it){
  const ph = it.img ? `<img src="${esc(it.img)}" alt="${esc(it.name)}" loading="lazy">` : esc(it.zh || "");
  const opts = it.opts ? `<div class="opts">${it.opts.map(o=>`<span>${esc(o)}</span>`).join("")}</div>` : "";
  const gi = it.gallery ? G.push(it) - 1 : -1;
  const more = gi >= 0 ? `<span class="more">맛별 사진 보기 ›</span>` : "";
  return `<div class="item${gi>=0?' has-g':''}"${gi>=0?` data-g="${gi}" role="button" tabindex="0"`:''}>
    <div class="ph" aria-hidden="${it.img?'false':'true'}">${ph}</div>
    <div class="meta">
      ${it.badge?`<span class="badge">${esc(it.badge)}</span>`:""}
      <span class="name">${esc(it.name)}</span>
      ${it.desc?`<span class="desc">${esc(it.desc)}</span>`:""}
      ${opts}
      ${more}
      <span class="price">${it.price!=null?won(it.price):'<span class="ask">가격은 매장 문의</span>'}</span>
    </div>
  </div>`;
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const out = [];
  G = [];
  for (const c of CATEGORIES){
    if (active!=="all" && c.id!==active) continue;
    const items = c.items.filter(it => !q ||
      [it.name,it.zh,it.desc,(it.opts||[]).join(" "),c.name].join(" ").toLowerCase().includes(q));
    if (!items.length) continue;
    out.push(`<section class="cat" id="${c.id}">
      <div class="cat-head"><h2>${esc(c.name)}</h2><span class="zh">${esc(c.zh)}</span>
      ${c.note?`<span class="note">${esc(c.note)}</span>`:""}</div>
      <div class="grid">${items.map(card).join("")}</div></section>`);
  }
  document.getElementById("list").innerHTML = out.length ? out.join("")
    : `<p class="empty">"${esc(q)}" 상품을 찾지 못했습니다.<br>위챗으로 문의해 주세요.</p>`;
}

document.getElementById("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  active = b.dataset.id; renderChips(); render();
});
document.getElementById("q").addEventListener("input", render);

function openG(it){
  document.getElementById("mTitle").textContent = it.name + " · " + won(it.price);
  const m = document.getElementById("mMain"); m.src = it.img; m.alt = it.name + " 6종";
  document.getElementById("mGrid").innerHTML = it.gallery.map(f => {
    const [x,y,w,h] = f.r;
    const bs = `${GW/w*100}% ${GH/h*100}%`;
    const bp = `${w>=GW?0:x/(GW-w)*100}% ${h>=GH?0:y/(GH-h)*100}%`;
    return `<div class="flav"><div class="crop" role="img" aria-label="${esc(f.k)}" style="aspect-ratio:${w}/${h};background-image:url('${esc(it.img)}');background-size:${bs};background-position:${bp}"></div><b>${esc(f.k)}</b><span>${esc(f.zh)}</span></div>`;
  }).join("");
  document.getElementById("modal").hidden = false;
  document.getElementById("mClose").focus();
}
function closeG(){ document.getElementById("modal").hidden = true; }
document.getElementById("list").addEventListener("click", e => { const c = e.target.closest(".has-g"); if (c) openG(G[+c.dataset.g]); });
document.getElementById("list").addEventListener("keydown", e => { const c = e.target.closest(".has-g"); if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openG(G[+c.dataset.g]); } });
document.getElementById("mClose").addEventListener("click", closeG);
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeG(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeG(); });

/* 영업 중 표시 (한국 시간 기준) */
function updateStatus(){
  const now = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));
  const d = now.getDay(), m = now.getHours()*60+now.getMinutes();
  const openAt = (d===0||d===6) ? 9*60 : 9*60+30, closeAt = 22*60;
  const el = document.getElementById("status");
  const isOpen = m>=openAt && m<closeAt;
  el.className = "status " + (isOpen?"open":"closed");
  el.textContent = isOpen ? "지금 영업 중" : "영업 종료";
}

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
}
document.getElementById("copyPhone").addEventListener("click", ()=>{
  const num = "worldmart_hwan";
  navigator.clipboard?.writeText(num).then(()=>toast("위챗 아이디를 복사했습니다"), ()=>{
    const r=document.createRange(); r.selectNodeContents(document.getElementById("phone"));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("아이디를 길게 눌러 복사하세요");
  }) ?? toast("아이디를 길게 눌러 복사하세요");
});

renderChips(); render(); updateStatus(); setInterval(updateStatus,60000);
</script>
